[package]
name = "zoeydaw"
version = "0.1.0"
description = "zoeydaw desktop shell — Web UI with a Rust audio core (prototype)"
authors = ["zoeydaw"]
license = "Apache-2.0"
repository = "https://github.com/zoeymind/zoeydaw"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zoeydaw_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.4", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
zoeydaw-media = { path = "../crates/media" }
zoeydaw-project = { path = "../crates/project" }
zoeydaw-browser = { path = "../crates/browser" }
zoeydaw-engine = { path = "../crates/engine" }
zoeydaw-plugin-host = { path = "../crates/plugin-host" }
zoeydaw-plugin-abi = { path = "../crates/plugin-abi" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
