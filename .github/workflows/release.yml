name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package (must match package versions)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate tag and product version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node scripts/release/metadata.mjs "$RELEASE_TAG")
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      # Match ci.yml: absolute paths without '..', immutable vendor and rolling Cargo caches.
      - name: Set build cache paths
        run: |
          echo "GPUIX_VENDOR_ROOT=$RUNNER_WORKSPACE/gpuix-vendor" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/gpuix-target" >> "$GITHUB_ENV"

      - name: Cache patched gpuix renderer
        uses: actions/cache@v4
        with:
          path: ${{ env.GPUIX_VENDOR_ROOT }}
          key: gpuix-vendor-${{ runner.os }}-${{ hashFiles('scripts/gpuix-main/config.json', 'scripts/gpuix-main/patches/**', 'scripts/gpuix-main/build.sh') }}

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**/*.rs', 'crates/**/Cargo.toml', 'scripts/gpuix-main/patches/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build patched gpuix renderer
        run: bash scripts/gpuix-main/build.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify:gpuix
        run: pnpm verify:gpuix HEAD~1

      - name: Install packaging tool
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: bun scripts/release/package.mjs "$RELEASE_VERSION" dist/release-assets

      - name: Smoke standalone native runtime
        run: |
          pnpm --filter @zoeydaw/gpuix-prototype exec tsc -p ../../scripts/release/tsconfig.json
          bun scripts/release/smoke.mjs dist/release-evidence

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/release-assets/*.dmg
            dist/release-assets/*.app.zip
            dist/release-assets/SHA256SUMS-*

  draft:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Verify checksums
        working-directory: release-assets
        run: |
          for checksum in SHA256SUMS-*; do sha256sum --check "$checksum"; done

      - name: Create or update draft only
        run: |
          PRERELEASE=false
          if [[ "$RELEASE_TAG" == *-* ]]; then PRERELEASE=true; fi
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            node -e 'if (!JSON.parse(require("fs").readFileSync("release-state.json", "utf8")).isDraft) process.exit(1)'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease="$PRERELEASE" --title "zoeydaw $RELEASE_TAG" --notes-file scripts/release/NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
