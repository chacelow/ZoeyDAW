name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", "THIRD_PARTY_NOTICES"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", "THIRD_PARTY_NOTICES"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpuix:
    name: verify:gpuix
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Read renderer commit
        id: renderer
        run: echo "commit=$(git rev-parse HEAD:vendor/gpuix)" >> "$GITHUB_OUTPUT"

      - name: Cache gpuix renderer build
        uses: actions/cache@v4
        with:
          path: vendor/gpuix/packages/native/build
          key: gpuix-${{ runner.os }}-${{ steps.renderer.outputs.commit }}

      - name: Cache app Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: app-target-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}
          restore-keys: app-target-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'vendor/gpuix/packages/native/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Build gpuix renderer
        run: node scripts/gpuix-main/build.mjs runtime

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify:gpuix
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$SCAN_BASE" in ""|0000000000000000000000000000000000000000) SCAN_BASE=HEAD~1 ;; esac
          bash scripts/verify-gpuix.sh "$SCAN_BASE"

      - name: Native geometry diagnostics
        if: failure()
        run: |
          PROBE_PASSES=1 bun scripts/gpuix-main/ci-geometry/probe.tsx
          PROBE_PASSES=4 bun scripts/gpuix-main/ci-geometry/probe.tsx

  windows:
    name: Windows x64 port
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: 3
      GPUIX_FORCE_WARP: 1
    steps:
      - name: Configure Windows Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Read renderer commit
        id: renderer
        run: echo "commit=$(git rev-parse HEAD:vendor/gpuix)" >> "$env:GITHUB_OUTPUT"
        shell: pwsh

      - name: Set Windows evidence path
        shell: pwsh
        run: |
          "B2_EVIDENCE_DIR=$env:RUNNER_TEMP/windows-evidence" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-evidence" | Out-Null

      - name: Cache gpuix renderer build
        uses: actions/cache@v4
        with:
          path: vendor/gpuix/packages/native/build
          key: gpuix-${{ runner.os }}-${{ steps.renderer.outputs.commit }}

      - name: Cache app Cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: app-target-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**/Cargo.toml', 'crates/**/*.rs') }}
          restore-keys: app-target-${{ runner.os }}-

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'vendor/gpuix/packages/native/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Build gpuix renderer
        run: node scripts/gpuix-main/build.mjs runtime

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify:windows
        run: |
          node scripts/verify-windows.mjs 2>&1 | Tee-Object -FilePath "$env:B2_EVIDENCE_DIR/verify-windows.log"
          exit $LASTEXITCODE
        shell: pwsh

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-evidence
          path: ${{ runner.temp }}/windows-evidence
          if-no-files-found: warn
