name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpuix:
    name: verify:gpuix
    runs-on: macos-15
    timeout-minutes: 90
    env:
      GPUIX_VENDOR_ROOT: ${{ github.workspace }}/../gpuix-vendor
      CARGO_TARGET_DIR: ${{ github.workspace }}/../gpuix-target
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache gpuix vendor and Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../gpuix-vendor
            ${{ github.workspace }}/../gpuix-target
            ~/.cargo/registry
            ~/.cargo/git
          key: gpuix-${{ runner.os }}-${{ hashFiles('scripts/gpuix-main/config.json', 'scripts/gpuix-main/patches/**', 'Cargo.lock') }}

      - name: Build patched gpuix renderer
        run: bash scripts/gpuix-main/build.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify:gpuix
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$SCAN_BASE" in ""|0000000000000000000000000000000000000000) SCAN_BASE=HEAD~1 ;; esac
          bash scripts/verify-gpuix.sh "$SCAN_BASE"
