name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpuix:
    name: verify:gpuix
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      # actions/cache rejects paths containing "..", so the vendor and target live under
      # RUNNER_WORKSPACE (the checkout's parent) as plain absolute paths. A "../" path silently
      # disabled the cache before, and every run rebuilt the renderer from scratch. Job-level env
      # cannot read the runner context, hence this step.
      - name: Set build cache paths
        run: |
          echo "GPUIX_VENDOR_ROOT=$RUNNER_WORKSPACE/gpuix-vendor" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/gpuix-target" >> "$GITHUB_ENV"

      # The patched renderer is a pure function of the pinned config and patch series: on a hit,
      # build.sh verifies the manifest and only links it (seconds instead of ~4 minutes).
      - name: Cache patched gpuix renderer
        uses: actions/cache@v4
        with:
          path: ${{ env.GPUIX_VENDOR_ROOT }}
          key: gpuix-vendor-${{ runner.os }}-${{ hashFiles('scripts/gpuix-main/config.json', 'scripts/gpuix-main/patches/**', 'scripts/gpuix-main/build.sh') }}

      # Cargo target and registry roll forward: an exact miss restores the newest previous target so
      # only changed crates recompile (@zoeydaw/native, and the renderer when patches change).
      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**/*.rs', 'crates/**/Cargo.toml', 'scripts/gpuix-main/patches/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build patched gpuix renderer
        run: bash scripts/gpuix-main/build.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify:gpuix
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$SCAN_BASE" in ""|0000000000000000000000000000000000000000) SCAN_BASE=HEAD~1 ;; esac
          bash scripts/verify-gpuix.sh "$SCAN_BASE"

      - name: Native geometry diagnostics
        if: failure()
        run: |
          PROBE_PASSES=1 bun scripts/gpuix-main/ci-geometry/probe.tsx
          PROBE_PASSES=4 bun scripts/gpuix-main/ci-geometry/probe.tsx
