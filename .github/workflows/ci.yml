name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpuix:
    name: verify:gpuix
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Set build cache paths
        run: |
          echo "GPUIX_VENDOR_ROOT=$RUNNER_WORKSPACE/gpuix-vendor" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/gpuix-target" >> "$GITHUB_ENV"

      - name: Cache patched gpuix renderer
        uses: actions/cache@v4
        with:
          path: ${{ env.GPUIX_VENDOR_ROOT }}
          key: gpuix-vendor-${{ runner.os }}-${{ hashFiles('scripts/gpuix-main/config.json', 'scripts/gpuix-main/patches/**', 'scripts/gpuix-main/build.sh') }}

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**/*.rs', 'crates/**/Cargo.toml', 'scripts/gpuix-main/patches/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build patched gpuix renderer
        run: bash scripts/gpuix-main/build.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify:gpuix
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$SCAN_BASE" in ""|0000000000000000000000000000000000000000) SCAN_BASE=HEAD~1 ;; esac
          bash scripts/verify-gpuix.sh "$SCAN_BASE"

      - name: Native geometry diagnostics
        if: failure()
        run: |
          PROBE_PASSES=1 bun scripts/gpuix-main/ci-geometry/probe.tsx
          PROBE_PASSES=4 bun scripts/gpuix-main/ci-geometry/probe.tsx

  windows:
    name: Windows x64 port
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: 3
      GPUIX_FORCE_WARP: 1
    steps:
      - name: Configure Windows Git line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set build cache paths
        shell: pwsh
        run: |
          "GPUIX_VENDOR_ROOT=$env:RUNNER_WORKSPACE/gpuix-vendor" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_WORKSPACE/gpuix-target" >> $env:GITHUB_ENV
          "B2_EVIDENCE_DIR=$env:RUNNER_TEMP/windows-evidence" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/windows-evidence" | Out-Null

      - name: Cache patched gpuix renderer
        uses: actions/cache@v4
        with:
          path: ${{ env.GPUIX_VENDOR_ROOT }}
          key: gpuix-vendor-${{ runner.os }}-${{ hashFiles('scripts/gpuix-main/config.json', 'scripts/gpuix-main/patches/**', 'scripts/gpuix-main/build-windows.mjs', 'scripts/gpuix-main/check.mjs', 'scripts/gpuix-main/paths.mjs') }}

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_TARGET_DIR }}
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'crates/**/*.rs', 'crates/**/Cargo.toml', 'scripts/gpuix-main/patches/**') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build patched Windows renderer
        run: node scripts/gpuix-main/build-windows.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify:windows
        run: |
          node scripts/verify-windows.mjs 2>&1 | Tee-Object -FilePath "$env:B2_EVIDENCE_DIR/verify-windows.log"
          exit $LASTEXITCODE

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-evidence
          path: ${{ runner.temp }}/windows-evidence
          if-no-files-found: warn
