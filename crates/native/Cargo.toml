[package]
name = "zoeydaw-native"
version = "0.1.0"
description = "zoeydaw native bridge (napi-rs): cursor lock, files, settings, engine glue"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
zoeydaw-engine = { path = "../engine" }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
