[package]
name = "zoeydaw-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-channel = "0.3.31"
zoeydaw-plugin-abi = { path = "../plugin-abi" }
arc-swap = "=1.9.3"
[[example]]
name = "audio_settings_cli"
path = "examples/audio_settings_cli.rs"

[build-dependencies]
cmake = "0.1.54"

[dev-dependencies]
zoeydaw-plugin-host = { path = "../plugin-host" }
