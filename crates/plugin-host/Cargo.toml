[package]
name = "zoeydaw-plugin-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
plughost = "=0.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tempfile = "3.27.0"
zoeydaw-plugin-abi = { path = "../plugin-abi" }

[dev-dependencies]
libloading = "0.9.0"
